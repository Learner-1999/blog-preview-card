<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Outfit:wght@100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <title>blog preview card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <article>
        <img
          class="illustration"
          src="images/illustration-article.png"
          alt="main image"
        />

        <div class="unclickable-button">
          <p>Learning</p>
        </div>

        <div class="publish-details">
          <p>Published 21 Dec 2023</p>
        </div>

        <header>
          <h1>HTML & CSS foundations</h1>
        </header>

        <p class="paragraph">
          These languages are the backbone of every website, defining structure,
          content and presentation.
        </p>

        <footer>
          <img
            class="avatar"
            src="images/image-avatar.png"
            alt="author photo"
          />
          <p class="author">
            <strong>Greg Hooper</strong>
          </p>
        </footer>
      </article>
    </main>
  </body>
</html>
